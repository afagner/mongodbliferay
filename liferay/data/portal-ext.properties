# --- Banco relacional: MySQL ---
jdbc.default.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.default.url=jdbc:mysql://mysql:3306/lportal?characterEncoding=UTF-8&dontTrackOpenResources=true&holdResultsOpenOverStatementClose=true&serverTimezone=GMT&useFastDateParsing=false&useUnicode=true
jdbc.default.username=liferay
jdbc.default.password=liferayProd@123

# --- Proxy reverso: Liferay usa X-Forwarded-* para montar URLs (CSS/JS) ---
# Guia: https://liferay.dev/b/comprehensive-guide-to-configuring-liferay-behind-a-reverse-proxy-nginx-apache-
web.server.forwarded.host.enabled=true
web.server.forwarded.host.header=X-Forwarded-Host

web.server.forwarded.port.enabled=true
web.server.forwarded.port.header=X-Forwarded-Port

web.server.forwarded.protocol.enabled=true
web.server.forwarded.protocol.header=X-Forwarded-Proto

# NÃO definir web.server.host/port/protocol estáticos - deixar o proxy informar via headers
# web.server.host=localhost
# web.server.port=8080
# web.server.protocol=http

portal.instance.protocol=http
portal.instance.https=false
company.security.auth.requires.https=false

virtual.hosts.allowed=localhost,localhost:8080,*
portal.ctx=/

# MongoDB (Document Library store)
dl.store.impl=com.liferay.portal.store.mongo.MongoDBStore
mongo.uri=mongodb://liferay:liferayProd%40123@mongodb:27017/lportal

# Elasticsearch
elasticsearch.host.name=elasticsearch
elasticsearch.port=9200
elasticsearch.operation.mode=REMOTE
